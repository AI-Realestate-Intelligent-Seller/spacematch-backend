[project]
name = "spacematch-reels"
version = "0.6.0"
requires-python = ">=3.12"
# Vercel installs from this list (it reads pyproject.toml before requirements.txt).
# Keep it in sync with requirements.txt, which the Dockerfile (Render) uses - tests/test_vercel.py checks this.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "cryptography>=43,<48",
    "python-dotenv>=1,<2",
    "itsdangerous>=2,<3",
    "playwright>=1.45,<2",
    "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
